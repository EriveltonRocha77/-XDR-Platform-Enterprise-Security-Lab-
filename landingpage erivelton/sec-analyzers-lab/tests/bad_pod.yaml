apiVersion: v1
kind: Pod
metadata:
  name: malicious-nginx-pod
spec:
  containers:
  - name: my-nginx
    image: nginx
    securityContext:
      privileged: true # VULN: Root host access (capabilities full)
      allowPrivilegeEscalation: true
    volumeMounts:
    - mountPath: /host
      name: host-root
  volumes:
  - name: host-root
    hostPath:
      path: /
